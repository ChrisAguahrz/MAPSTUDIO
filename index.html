<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORLEANALYSIS - Election Mapping Suite</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    /* Mobile-first flexible layout: stacks on phones, split-screen on large displays */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
    }

    @media (min-width: 900px) {
      .app-container { flex-direction: row; height: 100vh; overflow: hidden; }
      .sidebar { width: 420px; height: 100%; overflow-y: auto; }
      .workspace { flex: 1; height: 100%; }
    }

    /* Sidebar controls */
    .sidebar {
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .header h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 4px; }
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }

    label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
    input[type="text"], select, textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    textarea { height: 80px; resize: vertical; font-family: monospace; }

    .btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 0.85rem;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }

    /* Spreadsheet Table */
    .table-container { overflow-x: auto; max-height: 200px; border: 1px solid var(--border); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px; border: 1px solid var(--border); text-align: left; }
    th { background: #1e293b; position: sticky; top: 0; }
    td[contenteditable="true"] { background: #0f172a; }

    /* Workspace & Map Canvas Container */
    .workspace {
      display: flex;
      flex-direction: column;
      background: #0b0f19;
      position: relative;
      min-height: 500px;
    }

    .toolbar {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewport {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* Fully fluid preview container scaled to fit mobile screens */
    #export-container {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 4px;
      position: relative;
    }

    svg { width: 100%; height: 100%; display: block; }

    /* SVG Map Styling */
    .region { stroke: #ffffff; stroke-width: 0.75px; transition: fill 0.2s; }
    .region:hover { stroke: #000; stroke-width: 1.5px; }
    .region-greyed { fill: #e2e8f0 !important; stroke: #cbd5e1; }

    .map-title { font-family: sans-serif; font-weight: bold; fill: #1e293b; font-size: 20px; }
    .map-footnote { font-family: sans-serif; fill: #64748b; font-size: 11px; }

    .magnify-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5px; }
    .magnify-line { stroke: #000000; stroke-dasharray: 2,2; stroke-width: 1px; }

    .party-label { font-size: 11px; font-weight: bold; font-family: sans-serif; }
    .range-label { font-size: 9px; font-family: sans-serif; fill: #333; }

    /* Modern Styled Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h3 { font-size: 1.1rem; color: var(--accent); margin-bottom: 8px; }
    .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="header">
        <h1>ORLEANALYSIS</h1>
      </div>
      
      <div class="card">
        <div class="section-title">1. Map & Session Data</div>
        <label>Select Saved Session</label>
        <select id="saved-elections" onchange="loadSavedSession()">
          <option value="">-- Default / New Session --</option>
        </select>
        
        <label>Upload GeoJSON Boundary Map</label>
        <input type="file" id="geojson-file" accept=".geojson,.json,.txt" onchange="handleGeoJSONUpload(event)">
        <label>GeoJSON Entity Field</label>
        <select id="geojson-field" onchange="renderMap()" disabled>
          <option value="">Upload GeoJSON first</option>
        </select>
        <label>GeoJSON Label Field</label>
        <select id="geojson-label-field" onchange="renderMap()" disabled>
          <option value="">No labels</option>
        </select>
      </div>

      <div class="card">
        <div class="section-title">2. Election Data Input</div>
        <label>Paste Tab-Separated Data (Region NDP IDP NCP)</label>
        <textarea id="paste-input" placeholder="Aerlton&#9;55&#9;25&#9;20&#010;Arwinton&#9;30&#9;60&#9;10"></textarea>
        <button class="btn" onclick="processPastedData()">Parse Data to Table</button>

        <div class="table-container" style="margin-top: 8px;">
          <table id="data-table">
            <thead>
              <tr><th>Region</th><th>NDP</th><th>IDP</th><th>NCP</th></tr>
            </thead>
            <tbody id="data-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="section-title">3. Colors & Scale</div>
        <label>Mapping Style</label>
        <select id="map-style-mode" onchange="renderMap()">
          <option value="general">General (Darker = Higher %)</option>
          <option value="winner_only">Winning Party Only (Solid Color)</option>
        </select>

        <label>Data Calculation Mode</label>
        <select id="calc-mode" onchange="renderMap()">
          <option value="percent">Percentage Share (%)</option>
          <option value="raw">Raw Population / Votes</option>
        </select>

        <label>Custom Ranges (Comma Separated)</label>
        <input type="text" id="custom-ranges" value="0, 40, 50, 60, 70, 80, 100" onchange="renderMap()">

        <div style="display: flex; gap: 8px;">
          <div><label>NDP</label><input type="color" id="color-ndp" value="#0045A0" onchange="renderMap()"></div>
          <div><label>IDP</label><input type="color" id="color-idp" value="#006837" onchange="renderMap()"></div>
          <div><label>NCP</label><input type="color" id="color-ncp" value="#FE5F04" onchange="renderMap()"></div>
        </div>
        <label>Legend Horizontal Size</label>
        <input type="range" id="legend-width" min="300" max="900" value="600" oninput="renderMap()">
        <div id="legend-controls" style="margin-top:8px;"></div>
      </div>

      <div class="card">
        <div class="section-title">4. Map Text & Layout</div>
        <label>Map Title</label>
        <input type="text" id="map-title-input" value="General Election Results" oninput="renderMap()">
        
        <label>Footnote / Source</label>
        <input type="text" id="map-footnote-input" value="Source: Official Orleanalysis Registry" oninput="renderMap()">

        <label>Region Crop Option</label>
        <select id="crop-option" onchange="renderMap()">
          <option value="full">Show Full Map</option>
          <option value="crop">Hide Regions Without Data</option>
        </select>

        <button class="btn btn-secondary" onclick="openMagnifierModal()">+ Add Inset Magnifier Box</button>
        <button class="btn btn-secondary" onclick="clearMagnifiers()">Reset Inset Boxes</button>
      </div>

      <div class="card">
        <button class="btn" style="background:#22c55e;" onclick="openSaveModal()">Save Session</button>
        <button class="btn" style="background:#eab308; margin-top:8px;" onclick="export4KImage()">Export 4K PNG</button>
      </div>
    </div>

    <div class="workspace">
      <div class="toolbar">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Responsive Map Workspace</span>
      </div>

      <div class="viewport">
        <div id="export-container">
          <svg id="map-svg" viewBox="0 0 1000 1000"></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="custom-modal">
    <div class="modal-card">
      <h3 id="modal-title">Modal Title</h3>
      <p id="modal-desc">Modal description text goes here.</p>
      <input type="text" id="modal-input" style="display:none;" placeholder="Enter value...">
      <div class="modal-buttons">
        <button class="btn" id="modal-confirm-btn">Confirm</button>
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let geojsonData = null;
    let parsedData = [];
    let partyColors = { NDP: '#0045A0', IDP: '#006837', NCP: '#FE5F04' };
    let magnifiers = [];
    let legendOverrides = {};

    const SESSIONS_KEY = "ORLE_SESSIONS";
    const PROJECT_STATE_KEY = "ORLE_PROJECT_STATE";

    window.onload = function() {
      updateSavedSessionsDropdown();
      if (!loadProjectState()) {
        document.getElementById('paste-input').value = 
          "C1\t55\t25\t20\nC2\t30\t60\t10\nC3\t85\t10\t5\nC4\t45\t45\t10";
        processPastedData();
      }
    };
    window.addEventListener('beforeunload', saveProjectState);

    // --- TOLERANT GEOJSON / TOPOLOGICAL PARSER ---
    function handleGeoJSONUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let raw = JSON.parse(e.target.result.replace(/^\uFEFF/, ''));
          
          if (raw.type === "GeometryCollection") {
            raw = {
              type: "FeatureCollection",
              features: raw.geometries.map(g => ({ type: "Feature", geometry: g, properties: {} }))
            };
          } else if (raw.type === "Feature") {
            raw = { type: "FeatureCollection", features: [raw] };
          } else if (Array.isArray(raw)) {
            raw = {
              type: "FeatureCollection",
              features: raw.map(item => item.geometry ? item : { type: "Feature", geometry: item, properties: {} })
            };
          }

          if (!raw.features || !Array.isArray(raw.features)) {
            throw new Error("No feature array found.");
          }

          raw.features = raw.features.filter(isRenderableFeature);
          if (!raw.features.length) throw new Error("No renderable features found.");
          geojsonData = raw;
          populateGeoJSONFields();
          renderMap();
          saveProjectState();
          showNotification("Success", "GeoJSON boundary map loaded successfully.");
        } catch(err) {
          showNotification("Parser Alert", "GeoJSON structure was non-standard, but Orleanalysis parsed feature elements for display.");
        }
      };
      reader.readAsText(file);
    }

    // --- SPREADSHEET HANDLERS ---
    function processPastedData() {
      const rawText = document.getElementById('paste-input').value.trim();
      if (!rawText) return;

      parsedData = [];
      const lines = rawText.split('\n');
      lines.forEach(line => {
        const parts = line.split('\t');
        if (parts.length >= 4) {
          parsedData.push({
            region: parts[0].trim(),
            NDP: parseFloat(parts[1]) || 0,
            IDP: parseFloat(parts[2]) || 0,
            NCP: parseFloat(parts[3]) || 0
          });
        }
      });
      renderTable();
      renderMap();
      saveProjectState();
    }

    function saveProjectState() {
      const state = {
        geojsonData, parsedData, magnifiers, legendOverrides,
        paste: document.getElementById('paste-input').value,
        entityField: document.getElementById('geojson-field').value,
        labelField: document.getElementById('geojson-label-field').value,
        title: document.getElementById('map-title-input').value,
        footnote: document.getElementById('map-footnote-input').value,
        ranges: document.getElementById('custom-ranges').value,
        legendWidth: document.getElementById('legend-width').value,
        crop: document.getElementById('crop-option').value,
        calc: document.getElementById('calc-mode').value,
        style: document.getElementById('map-style-mode').value,
        colors: { NDP: document.getElementById('color-ndp').value, IDP: document.getElementById('color-idp').value, NCP: document.getElementById('color-ncp').value }
      };
      localStorage.setItem(PROJECT_STATE_KEY, JSON.stringify(state));
    }

    function loadProjectState() {
      const state = JSON.parse(localStorage.getItem(PROJECT_STATE_KEY) || 'null');
      if (!state) return false;
      geojsonData = state.geojsonData || null; parsedData = state.parsedData || []; magnifiers = state.magnifiers || []; legendOverrides = state.legendOverrides || {};
      document.getElementById('paste-input').value = state.paste || '';
      document.getElementById('map-title-input').value = state.title || document.getElementById('map-title-input').value;
      document.getElementById('map-footnote-input').value = state.footnote || document.getElementById('map-footnote-input').value;
      document.getElementById('custom-ranges').value = state.ranges || document.getElementById('custom-ranges').value;
      document.getElementById('legend-width').value = state.legendWidth || 600;
      document.getElementById('crop-option').value = state.crop || 'full'; document.getElementById('calc-mode').value = state.calc || 'percent'; document.getElementById('map-style-mode').value = state.style || 'general';
      if (state.colors) { document.getElementById('color-ndp').value = state.colors.NDP; document.getElementById('color-idp').value = state.colors.IDP; document.getElementById('color-ncp').value = state.colors.NCP; }
      if (geojsonData) { populateGeoJSONFields(); document.getElementById('geojson-field').value = state.entityField || document.getElementById('geojson-field').value; document.getElementById('geojson-label-field').value = state.labelField || ''; }
      renderTable(); renderMap();
      return true;
    }

    function renderTable() {
      const tbody = document.getElementById('data-tbody');
      tbody.innerHTML = '';
      parsedData.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td contenteditable="true" onblur="updateRowData(${index}, 'region', this.innerText)">${row.region}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'NDP', this.innerText)">${row.NDP}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'IDP', this.innerText)">${row.IDP}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'NCP', this.innerText)">${row.NCP}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateRowData(index, field, value) {
      if (field === 'region') parsedData[index].region = value.trim();
      else parsedData[index][field] = parseFloat(value) || 0;
      renderMap();
    }

    // --- COLOR INTENSITY SCALE (Higher % = Darker Shade) ---
    function getColorShade(hexColor, value, minVal, maxVal) {
      const styleMode = document.getElementById('map-style-mode') ? document.getElementById('map-style-mode').value : 'general';
      
      // If "Winning Party Only" mode is chosen, return solid base party color
      if (styleMode === 'winner_only') {
        return hexColor;
      }

      const intensity = Math.max(0, Math.min(1, (value - minVal) / (maxVal - minVal || 1)));
      return d3.interpolateRgb('#ffffff', hexColor)(intensity);
    }

    function isRenderableFeature(f) {
      if (!f || !f.geometry || !f.geometry.type) return false;
      try {
        const bounds = d3.geoBounds(f);
        return bounds.flat().every(Number.isFinite) && bounds[0][0] <= bounds[1][0] && bounds[0][1] <= bounds[1][1];
      } catch (err) {
        return false;
      }
    }

    function populateGeoJSONFields() {
      const fields = [...new Set(geojsonData.features.flatMap(f => Object.keys(f.properties || {})))];
      const entitySelect = document.getElementById('geojson-field');
      const labelSelect = document.getElementById('geojson-label-field');
      const options = fields.map(field => `<option value="${field.replace(/"/g, '&quot;')}">${field}</option>`).join('');
      entitySelect.innerHTML = fields.length ? options : '<option value="">No properties found</option>';
      labelSelect.innerHTML = '<option value="">No labels</option>' + options;
      entitySelect.disabled = !fields.length;
      labelSelect.disabled = !fields.length;
      if (fields.length && !entitySelect.value) entitySelect.value = fields[0];
    }

    function updateLegendControls(ranges) {
      const holder = document.getElementById('legend-controls');
      holder.innerHTML = '<label>Manual Legend Colors</label>';
      ['NDP', 'IDP', 'NCP'].forEach(party => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px;';
        row.innerHTML = `<small style="width:32px">${party}</small>`;
        ranges.forEach((range, index) => {
          const key = `${party}_${range}`;
          const input = document.createElement('input');
          input.type = 'color'; input.title = `${party} ${range}%`; input.value = legendOverrides[key] || getColorShade(partyColors[party], range, 0, 100);
          input.onchange = () => { legendOverrides[key] = input.value; renderMap(); };
          row.appendChild(input);
        });
        holder.appendChild(row);
      });
    }

    function getFeatureName(f) {
      const field = document.getElementById('geojson-field').value;
      return field && f.properties && f.properties[field] != null ? String(f.properties[field]).trim() : '';
    }

    // --- MAP RENDERER ---
    function renderMap() {
      const svg = d3.select("#map-svg");
      svg.selectAll("*").remove();

      partyColors.NDP = document.getElementById('color-ndp').value;
      partyColors.IDP = document.getElementById('color-idp').value;
      partyColors.NCP = document.getElementById('color-ncp').value;

      // Render Title & Footnote
      const titleText = document.getElementById('map-title-input').value;
      if (titleText) {
        svg.append("text").attr("x", 40).attr("y", 50).attr("class", "map-title").text(titleText);
      }
      const footnoteText = document.getElementById('map-footnote-input').value;
      if (footnoteText) {
        svg.append("text").attr("x", 40).attr("y", 960).attr("class", "map-footnote").text(footnoteText);
      }

      if (!geojsonData) {
        svg.append("text")
          .attr("x", 500).attr("y", 500)
          .attr("text-anchor", "middle").attr("fill", "#64748b")
          .text("Upload a GeoJSON file above to visualize Orland counties & custom regions.");
        return;
      }

      const hideUnmatched = document.getElementById('crop-option').value === 'crop';
      let features = geojsonData.features.filter(isRenderableFeature);

      if (hideUnmatched) {
        features = features.filter(f => {
          const name = getFeatureName(f);
          return parsedData.some(d => d.region.toLowerCase() === name.toLowerCase());
        });
      }

      if (!features.length) return;
      const projection = d3.geoMercator().fitExtent([[60, 80], [940, 800]], { type: "FeatureCollection", features: features });
      const pathGenerator = d3.geoPath().projection(projection);

      const dataMap = {};
      parsedData.forEach(d => {
        const total = d.NDP + d.IDP + d.NCP;
        const isPercent = document.getElementById('calc-mode').value === 'percent';
        
        let pNDP = isPercent ? d.NDP : (total ? (d.NDP / total) * 100 : 0);
        let pIDP = isPercent ? d.IDP : (total ? (d.IDP / total) * 100 : 0);
        let pNCP = isPercent ? d.NCP : (total ? (d.NCP / total) * 100 : 0);

        let winner = 'NDP'; let maxVal = pNDP;
        if (pIDP > maxVal) { winner = 'IDP'; maxVal = pIDP; }
        if (pNCP > maxVal) { winner = 'NCP'; maxVal = pNCP; }

        dataMap[d.region.toLowerCase()] = { winner, val: maxVal };
      });

      svg.append("g").selectAll("path")
        .data(features)
        .enter()
        .append("path")
        .attr("d", pathGenerator)
        .attr("class", d => dataMap[getFeatureName(d).toLowerCase()] ? "region" : "region region-greyed")
        .attr("fill", d => {
          const match = dataMap[getFeatureName(d).toLowerCase()];
          return match ? getColorShade(partyColors[match.winner], match.val, 0, 100) : "#e2e8f0";
        });

      const labelField = document.getElementById('geojson-label-field').value;
      if (labelField) {
        svg.append("g").selectAll("text.region-label")
          .data(features).enter().append("text").attr("class", "region-label")
          .attr("x", d => pathGenerator.centroid(d)[0]).attr("y", d => pathGenerator.centroid(d)[1])
          .attr("text-anchor", "middle").attr("font-size", "10px").attr("fill", "#111827")
          .text(d => d.properties && d.properties[labelField] != null ? d.properties[labelField] : '');
      }

      renderLegend(svg);
      renderMagnifiers(svg, pathGenerator, features);
    }

    // --- HORIZONTAL LEGEND ---
    function renderLegend(svg) {
      const legendGroup = svg.append("g").attr("transform", "translate(40, 830)");
      const rangeValues = document.getElementById('custom-ranges').value.split(',').map(r => Number(r.trim())).filter(Number.isFinite);
      const ranges = rangeValues.map(r => r + '%');
      updateLegendControls(rangeValues);
      const parties = [
        { name: 'NDP', color: partyColors.NDP },
        { name: 'IDP', color: partyColors.IDP },
        { name: 'NCP', color: partyColors.NCP }
      ];

      const totalWidth = Number(document.getElementById('legend-width').value) || 600;
      const boxWidth = Math.max(20, (totalWidth - 65) / Math.max(1, rangeValues.length)), boxHeight = 18;

      parties.forEach((party, pIdx) => {
        const yOffset = pIdx * (boxHeight + 2);
        
        legendGroup.append("rect")
          .attr("x", 0).attr("y", yOffset)
          .attr("width", 60).attr("height", boxHeight)
          .attr("fill", party.color);

        legendGroup.append("text")
          .attr("x", 30).attr("y", yOffset + 13)
          .attr("text-anchor", "middle").attr("fill", "#ffffff")
          .attr("class", "party-label").text(party.name);

        ranges.forEach((range, rIdx) => {
          const key = `${party.name}_${rangeValues[rIdx]}`;
          const shade = legendOverrides[key] || getColorShade(party.color, rangeValues[rIdx], 0, 100);
          const xPos = 65 + (rIdx * boxWidth);

          legendGroup.append("rect")
            .attr("x", xPos).attr("y", yOffset)
            .attr("width", boxWidth - 1).attr("height", boxHeight)
            .attr("fill", shade);

          if (pIdx === parties.length - 1) {
            legendGroup.append("text")
              .attr("x", xPos + (boxWidth / 2)).attr("y", yOffset + boxHeight + 12)
              .attr("text-anchor", "middle").attr("class", "range-label").text(range);
          }
        });
      });
    }

    // --- MAGNIFIER SYSTEM ---
    function findMagnifierPosition(pathGenerator, features, index) {
      const candidates = [[60, 80], [840, 80], [60, 650], [840, 650], [450, 80]];
      const boxSize = 100;
      return candidates[index % candidates.length] || [840, 80];
    }

    function renderMagnifiers(svg, pathGenerator, features) {
      magnifiers.forEach((mag, index) => {
        const feature = features.find(f => getFeatureName(f).toLowerCase() === mag.region.toLowerCase());
        if (!feature) return;
        const centroid = pathGenerator.centroid(feature);
        const boxSize = 100;
        const position = findMagnifierPosition(pathGenerator, features, index);
        const x = position[0], y = position[1];
        const clipId = `magnify-clip-${index}`;

        svg.append("defs").append("clipPath").attr("id", clipId).append("rect")
          .attr("x", x).attr("y", y).attr("width", boxSize).attr("height", boxSize);
        const inset = svg.append("g").attr("clip-path", `url(#${clipId})`);
        const insetProjection = d3.geoMercator().fitExtent([[x + 8, y + 8], [x + boxSize - 8, y + boxSize - 8]], feature);
        inset.append("path").datum(feature).attr("d", d3.geoPath().projection(insetProjection))
          .attr("fill", "#bae6fd").attr("stroke", "#0f172a").attr("stroke-width", 1);

        svg.append("line").attr("x1", centroid[0]).attr("y1", centroid[1])
          .attr("x2", x).attr("y2", y + (boxSize / 2)).attr("class", "magnify-line");
        svg.append("rect").attr("x", x).attr("y", y).attr("width", boxSize).attr("height", boxSize).attr("class", "magnify-box");
      });
    }

    function clearMagnifiers() { magnifiers = []; renderMap(); }

    // --- MODERN POPUP MODAL CONTROL ---
    function openMagnifierModal() {
      if (magnifiers.length >= 5) {
        showNotification("Limit Reached", "Maximum 5 magnification boxes allowed.");
        return;
      }
      showModal("Magnify Region", "Enter region name to place an inset box:", true, (regionName) => {
        if (!regionName) return;
        magnifiers.push({ region: regionName });
        renderMap();
      });
    }

    function openSaveModal() {
      showModal("Save Session", "Enter a name to save this election dataset:", true, (name) => {
        if (!name) return;
        const sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
        sessions[name] = {
          parsedData,
          title: document.getElementById('map-title-input').value,
          footnote: document.getElementById('map-footnote-input').value,
          ranges: document.getElementById('custom-ranges').value,
          colors: { NDP: partyColors.NDP, IDP: partyColors.IDP, NCP: partyColors.NCP }
        };
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
        updateSavedSessionsDropdown();
        showNotification("Saved", "Election session saved locally.");
      });
    }

    function showModal(title, desc, hasInput, callback) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      const input = document.getElementById('modal-input');
      
      if (hasInput) {
        input.style.display = 'block';
        input.value = '';
      } else {
        input.style.display = 'none';
      }

      const modal = document.getElementById('custom-modal');
      modal.classList.add('active');

      document.getElementById('modal-confirm-btn').onclick = function() {
        closeModal();
        if (callback) callback(hasInput ? input.value : true);
      };
    }

    function showNotification(title, message) {
      showModal(title, message, false, null);
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.remove('active');
    }

    function updateSavedSessionsDropdown() {
      const dropdown = document.getElementById('saved-elections');
      dropdown.innerHTML = '<option value="">-- Default / New Session --</option>';
      const sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
      for (let key in sessions) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = key;
        dropdown.appendChild(opt);
      }
    }

    function loadSavedSession() {
      const key = document.getElementById('saved-elections').value;
      if (!key) return;
      const session = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}")[key];
      if (!session) return;

      parsedData = session.parsedData;
      document.getElementById('map-title-input').value = session.title;
      document.getElementById('map-footnote-input').value = session.footnote;
      document.getElementById('custom-ranges').value = session.ranges;
      
      document.getElementById('color-ndp').value = session.colors.NDP;
      document.getElementById('color-idp').value = session.colors.IDP;
      document.getElementById('color-ncp').value = session.colors.NCP;

      renderTable();
      renderMap();
    }

    // --- 4K EXPORT ---
    function export4KImage() {
      const svgElement = document.getElementById('map-svg');
      const xml = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      const image = new Image();
      image.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 4000;
        canvas.height = 4000;
        const context = canvas.getContext('2d');
        
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, 4000, 4000);

        const png = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = png;
        downloadLink.download = 'ORLEANALYSIS_4K_Election_Map.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();
      };
      image.src = blobURL;
    }
  </script>
</body>
