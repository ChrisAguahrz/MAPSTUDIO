<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORLEANALYSIS - Election Mapping Suite</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
    }

    @media (min-width: 900px) {
      .app-container { flex-direction: row; height: 100vh; overflow: hidden; }
      .sidebar { width: 420px; height: 100%; overflow-y: auto; }
      .workspace { flex: 1; height: 100%; }
    }

    .sidebar {
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .header h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 4px; }
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }

    label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
    input[type="text"], select, textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    textarea { height: 80px; resize: vertical; font-family: monospace; }

    .btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 0.85rem;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }

    .table-container { overflow-x: auto; max-height: 200px; border: 1px solid var(--border); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px; border: 1px solid var(--border); text-align: left; }
    th { background: #1e293b; position: sticky; top: 0; }
    td[contenteditable="true"] { background: #0f172a; }

    .workspace {
      display: flex;
      flex-direction: column;
      background: #0b0f19;
      position: relative;
      min-height: 500px;
    }

    .toolbar {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 500px;
      background: #0b0f19;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h3 { font-size: 1.1rem; color: var(--accent); margin-bottom: 8px; }
    .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="header">
        <h1>ORLEANALYSIS</h1>
      </div>
      
      <div class="card">
        <div class="section-title">1. Map & Session Data</div>
        <label>Select Saved Session</label>
        <select id="saved-elections" onchange="loadSavedSession()">
          <option value="">-- Default / New Session --</option>
        </select>
        
        <label>Upload GeoJSON Boundary Map</label>
        <input type="file" id="geojson-file" accept=".geojson,.json,.txt" onchange="handleGeoJSONUpload(event)">
      </div>

      <div class="card">
        <div class="section-title">2. Election Data Input</div>
        <label>Paste Tab-Separated Data (County NDP IDP NCP)</label>
        <textarea id="paste-input" placeholder="C1&#9;55&#9;25&#9;20&#010;C2&#9;30&#9;60&#9;10&#010;C3&#9;15&#9;15&#9;70"></textarea>
        <button class="btn" onclick="processPastedData()">Parse Data to Table</button>

        <div class="table-container" style="margin-top: 8px;">
          <table id="data-table">
            <thead>
              <tr><th>County</th><th>NDP</th><th>IDP</th><th>NCP</th></tr>
            </thead>
            <tbody id="data-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="section-title">3. Colors & Scale</div>
        <label>Mapping Mode</label>
        <select id="mapModeDropdown" onchange="renderMap()">
          <option value="general">General (Darker = Higher %)</option>
          <option value="winner_only">Winning Party Only (Solid Colors)</option>
        </select>

        <label>Data Calculation Mode</label>
        <select id="calc-mode" onchange="renderMap()">
          <option value="percent">Percentage Share (%)</option>
          <option value="raw">Raw Population / Votes</option>
        </select>

        <div style="display: flex; gap: 8px;">
          <div><label>NDP</label><input type="color" id="color-ndp" value="#0045A0" onchange="renderMap()"></div>
          <div><label>IDP</label><input type="color" id="color-idp" value="#006837" onchange="renderMap()"></div>
          <div><label>NCP</label><input type="color" id="color-ncp" value="#FE5F04" onchange="renderMap()"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">4. Map Text & Layout</div>
        <label>Map Title</label>
        <input type="text" id="map-title-input" value="Commonwealth of Orland Election" oninput="renderMap()">
        
        <label>Footnote / Source</label>
        <input type="text" id="map-footnote-input" value="Source: Official Orland Electoral Registry" oninput="renderMap()">
      </div>

      <div class="card">
        <button class="btn" style="background:#22c55e;" onclick="openSaveModal()">Save Session</button>
      </div>
    </div>

    <div class="workspace">
      <div class="toolbar">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Responsive Map Workspace</span>
      </div>

      <div class="viewport">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="custom-modal">
    <div class="modal-card">
      <h3 id="modal-title">Modal Title</h3>
      <p id="modal-desc">Modal description text goes here.</p>
      <input type="text" id="modal-input" style="display:none;" placeholder="Enter value...">
      <div class="modal-buttons">
        <button class="btn" id="modal-confirm-btn">Confirm</button>
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let geojsonData = null;
    let geojsonLayer = null;
    let parsedData = [];
    let partyColors = { NDP: '#0045A0', IDP: '#006837', NCP: '#FE5F04' };

    const SESSIONS_KEY = "ORLE_SESSIONS";

    // Initialize Leaflet Map
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    window.onload = function() {
      updateSavedSessionsDropdown();
      document.getElementById('paste-input').value = 
        "C1\t55\t25\t20\nC2\t30\t60\t10\nC3\t15\t15\t70\nC4\t10\t80\t10";
      processPastedData();
    };

    // GeoJSON Upload Handler
    function handleGeoJSONUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          geojsonData = JSON.parse(e.target.result);
          renderMap();
          showNotification("Success", "Orland GeoJSON map loaded successfully.");
        } catch(err) {
          showNotification("Error", "Could not parse GeoJSON file format.");
        }
      };
      reader.readAsText(file);
    }

    // Spreadsheet Data Parsing
    function processPastedData() {
      const rawText = document.getElementById('paste-input').value.trim();
      if (!rawText) return;

      parsedData = [];
      const lines = rawText.split('\n');
      lines.forEach(line => {
        const parts = line.split('\t');
        if (parts.length >= 4) {
          parsedData.push({
            county: parts[0].trim(),
            NDP: parseFloat(parts[1]) || 0,
            IDP: parseFloat(parts[2]) || 0,
            NCP: parseFloat(parts[3]) || 0
          });
        }
      });
      renderTable();
      renderMap();
    }

    function renderTable() {
      const tbody = document.getElementById('data-tbody');
      tbody.innerHTML = '';
      parsedData.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td contenteditable="true" onblur="updateRowData(${index}, 'county', this.innerText)">${row.county}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'NDP', this.innerText)">${row.NDP}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'IDP', this.innerText)">${row.IDP}</td>
          <td contenteditable="true" onblur="updateRowData(${index}, 'NCP', this.innerText)">${row.NCP}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateRowData(index, field, value) {
      if (field === 'county') parsedData[index].county = value.trim();
      else parsedData[index][field] = parseFloat(value) || 0;
      renderMap();
    }

    // Calculation for darker intensity at higher percentages
    function getCountyStyle(feature) {
      const countyKey = feature.properties.County || feature.properties.name || '';
      const match = parsedData.find(d => d.county.toLowerCase() === countyKey.toLowerCase());
      
      if (!match) {
        return { fillColor: "#cbd5e1", weight: 1, opacity: 1, color: "#334155", fillOpacity: 0.3 };
      }

      const total = match.NDP + match.IDP + match.NCP;
      let pNDP = (match.NDP / (total || 1)) * 100;
      let pIDP = (match.IDP / (total || 1)) * 100;
      let pNCP = (match.NCP / (total || 1)) * 100;

      let winner = 'NDP'; let maxVal = pNDP;
      if (pIDP > maxVal) { winner = 'IDP'; maxVal = pIDP; }
      if (pNCP > maxVal) { winner = 'NCP'; maxVal = pNCP; }

      partyColors.NDP = document.getElementById('color-ndp').value;
      partyColors.IDP = document.getElementById('color-idp').value;
      partyColors.NCP = document.getElementById('color-ncp').value;

      const mappingMode = document.getElementById('mapModeDropdown').value;
      let opacity = 0.85;

      if (mappingMode === 'general') {
        // Darker / more solid fill for higher vote percentages
        opacity = 0.35 + ((maxVal / 100) * 0.6);
      } else {
        opacity = 0.85; // Solid winning color
      }

      return {
        fillColor: partyColors[winner],
        weight: 1.5,
        opacity: 1,
        color: "#ffffff",
        fillOpacity: opacity
      };
    }

    function renderMap() {
      if (!geojsonData) return;

      if (geojsonLayer) {
        map.removeLayer(geojsonLayer);
      }

      geojsonLayer = L.geoJSON(geojsonData, {
        style: getCountyStyle,
        onEachFeature: function(feature, layer) {
          const cName = feature.properties.County || 'Unknown';
          const reg = feature.properties.REGION || '';
          const match = parsedData.find(d => d.county.toLowerCase() === cName.toLowerCase());

          let content = `<div style="color:#000;"><b>County:</b> ${cName}<br><b>Region:</b> ${reg}<br>`;
          if (match) {
            content += `<hr><b>NDP:</b> ${match.NDP} | <b>IDP:</b> ${match.IDP} | <b>NCP:</b> ${match.NCP}`;
          }
          content += `</div>`;
          layer.bindPopup(content);
        }
      }).addTo(map);

      // Auto-center view directly to Orland boundary coordinates
      if (geojsonLayer.getBounds().isValid()) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
      }
    }

    // Modal Control Logic
    function openSaveModal() {
      showModal("Save Session", "Enter session name:", true, (name) => {
        if (!name) return;
        const sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
        sessions[name] = {
          parsedData,
          title: document.getElementById('map-title-input').value,
          footnote: document.getElementById('map-footnote-input').value,
          colors: { NDP: partyColors.NDP, IDP: partyColors.IDP, NCP: partyColors.NCP }
        };
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
        updateSavedSessionsDropdown();
        showNotification("Saved", "Election session saved locally.");
      });
    }

    function showModal(title, desc, hasInput, callback) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      const input = document.getElementById('modal-input');
      
      input.style.display = hasInput ? 'block' : 'none';
      if (hasInput) input.value = '';

      const modal = document.getElementById('custom-modal');
      modal.classList.add('active');

      document.getElementById('modal-confirm-btn').onclick = function() {
        closeModal();
        if (callback) callback(hasInput ? input.value : true);
      };
    }

    function showNotification(title, message) {
      showModal(title, message, false, null);
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.remove('active');
    }

    function updateSavedSessionsDropdown() {
      const dropdown = document.getElementById('saved-elections');
      dropdown.innerHTML = '<option value="">-- Default / New Session --</option>';
      const sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
      for (let key in sessions) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = key;
        dropdown.appendChild(opt);
      }
    }

    function loadSavedSession() {
      const key = document.getElementById('saved-elections').value;
      if (!key) return;
      const session = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}")[key];
      if (!session) return;

      parsedData = session.parsedData;
      document.getElementById('map-title-input').value = session.title;
      document.getElementById('map-footnote-input').value = session.footnote;
      
      document.getElementById('color-ndp').value = session.colors.NDP;
      document.getElementById('color-idp').value = session.colors.IDP;
      document.getElementById('color-ncp').value = session.colors.NCP;

      renderTable();
      renderMap();
    }
  </script>
</body>
</html>
